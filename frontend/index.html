<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizzy Base Transfer</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Base Mainnet</p>
          <h1>Bizzy Transfer</h1>
        </div>
        <button id="connectBtn" class="primary">Connect Wallet</button>
      </section>

      <section class="status-panel">
        <div class="status" id="status">Not connected</div>
        <dl class="meta">
          <div>
            <dt>Wallet</dt>
            <dd id="account">-</dd>
          </div>
          <div>
            <dt>Allowed user</dt>
            <dd id="allowedUser">-</dd>
          </div>
          <div>
            <dt>Network</dt>
            <dd id="network">-</dd>
          </div>
        </dl>
      </section>

      <section class="transfer-panel">
        <div class="panel-heading">
          <div>
            <h2>Pending Assets</h2>
            <p>Click one pending asset, confirm recipient and amount, then transfer it.</p>
          </div>
          <button id="refreshBtn" class="secondary" disabled>Refresh</button>
        </div>

        <div class="transfer-layout">
          <div id="assetList" class="pending-list"></div>
          <aside id="transferDetail" class="transfer-detail"></aside>
        </div>

        <section class="record-panel">
          <div class="record-heading">
            <h2>Transfer Records</h2>
            <button id="copyRecordsBtn" class="secondary" disabled>Copy JSON</button>
          </div>
          <div id="transferRecords" class="record-list"></div>
        </section>
      </section>

    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
